name: Sync Source to Source-only Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            Sonheim/Source
            Sonheim/Config
            Sonheim/Plugins
            Sonheim/Sonheim.uproject
            Doc
          sparse-checkout-cone-mode: false

      - name: Prepare mirror workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          if [ -d "Sonheim/Source" ]; then rsync -av --delete "Sonheim/Source/" "out/Source/"; fi
          if [ -d "Sonheim/Config" ]; then rsync -av --delete "Sonheim/Config/" "out/Config/"; fi

          if [ -d "Sonheim/Plugins" ]; then
            rsync -av --delete \
              --include='*/' \
              --include='*/Source/***' \
              --exclude='*' \
              "Sonheim/Plugins/" "out/Plugins/"
          fi

          if [ -f "Sonheim/Sonheim.uproject" ]; then cp "Sonheim/Sonheim.uproject" "out/Sonheim.uproject"; fi
          if [ -d "Doc" ]; then rsync -av --delete "Doc/" "out/Docs/"; fi

          cat > out/README.md << 'EOF'
# Sonheim.Source — source-only mirror
#Automated mirror of the main Sonheim (Unreal) repo, focused on code and docs.
Includes: Source/, Config/, Plugins/*/Source, Sonheim.uproject, Docs/
Excludes: Content/, Binaries/, Intermediate/
Source of truth: the main repository.
EOF

      - name: Push to source-only repo
        working-directory: out
        env:
          MIRROR_REPO: ${{ secrets.SONHEIM_SOURCE_REPO }}
          MIRROR_PAT: ${{ secrets.SONHEIM_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(mirror): sync from $GITHUB_SHA"
          git branch -M main
          git remote add origin "https://x-access-token:${MIRROR_PAT}@github.com/${MIRROR_REPO}.git"
          git push -f origin main

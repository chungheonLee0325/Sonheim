name: Publish GitHub Wiki

on:
  pull_request:
    paths:
      - 'Tools/wiki_publish.py'
      - 'Tools/test_wiki_publish.py'
      - '.github/workflows/publish-wiki.yml'
      - 'Doc/Wiki/**'
  push:
    branches: [main]
    paths:
      - 'Doc/Wiki/**'
      - 'Tools/wiki_publish.py'
      - 'Tools/test_wiki_publish.py'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            Doc/Wiki
            Tools

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate link conversion
        run: python3 -m unittest discover -s Tools -p 'test_wiki_publish.py' -v

      - name: Render flat Wiki pages
        run: |
          python3 Tools/wiki_publish.py \
            --source Doc/Wiki \
            --output "$RUNNER_TEMP/wiki-pages" \
            --repo "$GITHUB_REPOSITORY" \
            --branch main \
            --profile sonheim

      - name: Publish to GitHub Wiki
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          WIKI_URL="https://github.com/$GITHUB_REPOSITORY.wiki.git"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # Wiki repository exists after the first page is created in the GitHub Wiki tab.
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              clone --quiet "$WIKI_URL" wiki-repo; then
            echo "::error::Create a first page in Settings > Features > Wikis, then Wiki > Create the first page, and re-run this workflow."
            exit 1
          fi

          cp "$RUNNER_TEMP/wiki-pages/"*.md wiki-repo/
          cd wiki-repo

          # 2025 documentation lives only in Doc/Legacy, not in GitHub Wiki.
          # Delete the earlier Wiki-side Legacy index and individual old pages.
          # The source files and full Git history remain intact.
          PYTHONPATH="$GITHUB_WORKSPACE/Tools" python3 - <<'PY'
          import os
          from pathlib import Path
          from wiki_publish import legacy_sources

          saved = Path(os.environ["GITHUB_WORKSPACE"]) / "Doc/Legacy"
          retired = []
          for source in legacy_sources(saved):
              page = Path.cwd() / source.name
              if page.is_file():
                  page.unlink()
                  retired.append(page.name)
          legacy_index = Path.cwd() / "Legacy.md"
          if legacy_index.is_file():
              legacy_index.unlink()
              retired.append(legacy_index.name)
          print(f"Retired {len(retired)} Wiki archive pages; originals remain in {saved}.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
            exit 0
          fi

          git commit -m "docs(wiki): publish from $GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD

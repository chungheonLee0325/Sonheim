[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
; Tags replicate as a network index instead of their name; the server and the clients run the same build, so their tag lists match.
FastReplication=True
; Names from before the dungeons had their own tag trees, so data saved with them loads as the new tags.
+GameplayTagRedirects=(OldTagName="Dungeon.HUD",NewTagName="UI.Dungeon.HUD")
+GameplayTagRedirects=(OldTagName="Dungeon.Result",NewTagName="UI.Dungeon.Result")
+GameplayTagRedirects=(OldTagName="Dungeon.State.ShortcutUnlocked",NewTagName="Dungeon.ForgottenRuins.State.ShortcutUnlocked")

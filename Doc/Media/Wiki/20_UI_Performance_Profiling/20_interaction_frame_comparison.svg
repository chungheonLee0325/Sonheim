<svg xmlns="http://www.w3.org/2000/svg" width="950" height="492" viewBox="0 0 950 492" role="img" aria-labelledby="title desc">
<title id="title">Sonheim UI 조작 이벤트 프레임 비교</title>
<desc id="desc">PR #6 기준 1920×1080, 이벤트 프레임 중앙값. 아이템 교환 32.6에서 17.1ms, 인벤토리 열기 57.5에서 22.1ms, 도감 열기 25.8에서 22.6ms, 월드맵 열기 21에서 19.6ms, 보관함 열기 30.4에서 22.6ms.</desc>
<style>
  .headline {font-family: "Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif; font-size: 23px; font-weight: 700; fill: #183046}
  .sub {font-family: "Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif; font-size: 13px; fill: #516476}
  .legend {font-family: "Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif; font-size: 13px; fill: #33495c}
  .label {font-family: "Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif; font-size: 15px; font-weight: 600; fill: #24394c}
  .value {font-family: Arial,sans-serif; font-size: 12px; fill: #53667a; font-weight: 600}
  .after {fill: #146b72}
  .axis {font-family: Arial,sans-serif; font-size: 12px; fill: #6b7d8d}
</style>
<rect x="0" y="0" width="950" height="492" rx="14" fill="#ffffff" />
